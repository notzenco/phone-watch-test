name: PhoneWatchTest

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Apple Distribution
      DEVELOPMENT_TEAM: N7447R8KW2

targets:
  PhoneWatchTest:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneWatchTest
    info:
      path: PhoneWatchTest/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Phone Watch Test
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.notzenco.phonewatchtest
        PRODUCT_NAME: PhoneWatchTest
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: N7447R8KW2
          PROVISIONING_PROFILE_SPECIFIER: Phone Watch Test App Store
    dependencies:
      - target: PhoneWatchTestWatch

  PhoneWatchTestWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: PhoneWatchTestWatch
    info:
      path: PhoneWatchTestWatch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Habits
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.notzenco.phonewatchtest
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.notzenco.phonewatchtest.watchkitapp
        PRODUCT_NAME: PhoneWatchTestWatch
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=watchos*]": Apple Distribution
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: N7447R8KW2
          PROVISIONING_PROFILE_SPECIFIER: Phone Watch Test Watch App Store

  PhoneWatchTestTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared
      - path: PhoneWatchTestTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notzenco.phonewatchtest.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  PhoneWatchTest:
    build:
      targets:
        PhoneWatchTest: all
  PhoneWatchTestWatch:
    build:
      targets:
        PhoneWatchTestWatch: all
  PhoneWatchTestTests:
    build:
      targets:
        PhoneWatchTestTests: all
    test:
      targets:
        - PhoneWatchTestTests
      gatherCoverageData: true
