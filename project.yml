name: PhoneWatchTest

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic

targets:
  PhoneWatchTest:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: PhoneWatchTest
    info:
      path: PhoneWatchTest/Info.plist
      properties:
        CFBundleDisplayName: Phone Watch Test
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notzenco.phonewatchtest
        PRODUCT_NAME: PhoneWatchTest
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PhoneWatchTestWatch

  PhoneWatchTestWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: PhoneWatchTestWatch
    info:
      path: PhoneWatchTestWatch/Info.plist
      properties:
        CFBundleDisplayName: Habits
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.notzenco.phonewatchtest
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notzenco.phonewatchtest.watchkitapp
        PRODUCT_NAME: PhoneWatchTestWatch
        TARGETED_DEVICE_FAMILY: "4"

  PhoneWatchTestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneWatchTestTests
    dependencies:
      - target: PhoneWatchTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notzenco.phonewatchtest.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  PhoneWatchTest:
    build:
      targets:
        PhoneWatchTest: all
        PhoneWatchTestTests:
          - test
    test:
      targets:
        - PhoneWatchTestTests
      gatherCoverageData: true
  PhoneWatchTestWatch:
    build:
      targets:
        PhoneWatchTestWatch: all
